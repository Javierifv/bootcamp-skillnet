<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post" style="border: 3px solid black; padding-left: 3%; padding-bottom: 4%;">
            <h1>¡Regístrate y únete a la comunidad!</h1>
        <div style="margin-bottom: 2%;">
            <label for="nombre">Nombre: </label>
            <input type="text" id="nombre" name="nombre">
        </div>
        <div style="margin-bottom: 2%;">
            <label for="apellido">Apellido: </label>
            <input type="text" id="apellido" name="apellido">
        </div>
        <div style="margin-bottom: 2%;">
            <label for="correo">Correo Electrónico: </label>
            <input type="email" id="correo" name="correo" />
        </div>
        <div style="margin-bottom: 2%;">
            <label for="clave">Contraseña: </label>
            <input type="password" id="clave" name="clave" />
        </div>
        <div style="margin-bottom: 2%;">
            <label for="confirmar-clave">Confirmar Contraseña: </label>
            <input type="password" id="confirmar-clave" name="confirmar-clave" />
        </div>        
        <div style="margin-bottom: 2%;">
            <label for="fecha_nacimiento">Fecha de Nacimiento: </label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" />
        </div>
        <div style="margin-bottom: 2%;">
            <label>Género:</label>
            <input type="radio" id="masculino" name="genero"/>
            <label for="masculino">Masculino</label>
            <input type="radio" id="femenino" name="genero"/>
            <label for="femenino">Femenino</label>
            <input type="radio" id="prefiero-no-decir" name="genero"/>
            <label for="prefiero-no-decir">Prefiero no decir</label>
        </div>
        <div style="margin-bottom: 2%;">                
            <input type="checkbox" id="suscribete" name="suscribete" />
            <label for="suscribete">Suscríbete a nuestro boletín de noticias</label>
        </div>
        <div style="display: flex; flex-direction: column; margin-bottom: 2%;">
            <label for="descripcion">Una descripción de mi mismo: </label>
            <textarea id="descripcion" name="descripcion" style="width: 170px; height: 60px;"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; margin-bottom: 3%; ">
            <label for="intereses">Selecciona tus intereses: </label>
            <select id="intereses" name="intereses" multiple size="4" style="width: 90px;">
                <option value="musica">Música</option>
                <option value="deportes">Deportes</option>
                <option value="viajes">Viajes</option>
                <option value="tecnologia">Tecnología</option>
            </select>
        </div>
        <input type="submit" value="¡Registrarse!" />
    </form>
</body>
