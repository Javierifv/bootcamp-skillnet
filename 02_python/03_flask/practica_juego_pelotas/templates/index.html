<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Pelotas</title>
    <style>
        .pelota {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body style="text-align: center;">
    <h1>Juguemos a las pelotas</h1>
    {% for i in range(cantidad): %}
        <div class="pelota" style="background-color: {{ color }};"></div>
    {% endfor %}
</body>
</html>
